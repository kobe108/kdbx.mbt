name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        # Warnings are kept visible but do not fail the build: a newer toolchain
        # may introduce new deprecations, and a red badge would hide the signal
        # we actually care about (tests and interface drift).
        run: moon check

      - name: Run tests
        run: moon test

      - name: Keep generated interfaces in sync
        run: |
          moon info
          git diff --exit-code
