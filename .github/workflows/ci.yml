name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: |
          moon version --all
          moon update

      # The next two checks depend on the exact toolchain revision: a newer
      # release may format the same code differently or emit a slightly
      # different interface file. They stay visible as warnings, while only
      # checks that judge correctness decide whether the build is red.
      - name: Check formatting
        continue-on-error: true
        run: moon fmt --check

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test

      - name: Run acceptance demo
        run: sh scripts/demo.sh

      - name: Keep generated interfaces in sync
        continue-on-error: true
        run: |
          moon info
          git diff --exit-code
